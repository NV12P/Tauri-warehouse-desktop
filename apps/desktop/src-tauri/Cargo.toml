[package]
name = "gudang-desktop"
version = "0.1.0"
description = "Aplikasi Gudang Desktop"
authors = ["Aplikasi Gudang Team"]
edition = "2021"

[lib]
name = "gudang_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
gudang-api = { path = "../../api" }
